<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <title>Absensi Siswa dengan Barcode</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <h1>Absensi Siswa</h1>
    <div id="reader" style="width:300px;"></div>
    <p>Hasil Scan: <span id="result">-</span></p>

    <form id="attendanceForm" style="margin-top:20px;">
        <label for="nama">Nama Siswa:</label><br>
        <input type="text" id="nama" name="nama" required><br><br>

        <label for="tanggal">Tanggal:</label><br>
        <input type="date" id="tanggal" name="tanggal" required value=""><br><br>

        <label for="status">Status:</label><br>
        <select id="status" name="status">
            <option value="Hadir">Hadir</option>
            <option value="Izin">Izin</option>
            <option value="Alpa">Alpa</option>
        </select><br><br>

        <button type="submit">Kirim Absensi</button>
    </form>

    <script>
        // Set default tanggal hari ini
        document.getElementById("tanggal").valueAsDate = new Date();

        // Mulai scanner barcode
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 250 },
            (decodedText, decodedResult) => {
                document.getElementById("result").innerText = decodedText;
                document.getElementById("nama").value = decodedText;
                html5QrCode.stop(); // Berhenti scan setelah scan berhasil
            },
            (errorMessage) => {
                // console.log("Scan error:", errorMessage);
            }
        ).catch(err => {
            console.error("Error starting scanner: ", err);
        });

        // Tangkap submit form (saat ini cuma menunjukkan data input)
        document.getElementById("attendanceForm").addEventListener("submit", function(e){
            e.preventDefault();
            alert(
                `Absensi dikirim:\nNama: ${this.nama.value}\nTanggal: ${this.tanggal.value}\nStatus: ${this.status.value}`
            );
            // TODO: Kirim data ke tempat penyimpanan
        });
    </script>
</body>
</html>
